<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0C2B3B">
<title>Form.io</title>
<link rel="icon" href="/logo.png">
<style>
  :root { --azul-noche:#0C2B3B; --verde-azulado:#00827E; --verde-menta:#2ED891; --blanco:#FFFFFF; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
         background: var(--azul-noche); color: var(--blanco); overflow-x: hidden;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; position: relative; }
  body::before { content: ""; position: fixed; width: 260px; height: 260px; border-radius: 50%;
                 background: var(--verde-azulado); top: -90px; right: -110px; }
  body::after { content: ""; position: fixed; width: 120px; height: 120px; border-radius: 50%;
                border: 16px solid var(--verde-menta); bottom: -40px; left: -40px; }
  .caja { position: relative; z-index: 1; width: 100%; max-width: 380px; text-align: center; }
  img { width: 96px; height: 96px; border-radius: 24px; }
  h1 { margin: 18px 0 6px; font-size: 28px; } h1 span { color: var(--verde-menta); }
  p { margin: 0 0 24px; color: rgba(255,255,255,.75); }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; height: 52px; border: none; border-radius: 14px; padding: 0 16px;
          font: inherit; font-size: 18px; letter-spacing: 3px; text-transform: uppercase; text-align: center; }
  button { height: 52px; padding: 0 20px; border: none; border-radius: 14px; font: inherit; font-weight: 700;
           background: var(--verde-menta); color: var(--azul-noche); cursor: pointer; }
</style>
</head>
<body>
  <div class="caja">
    <img src="/logo.png" alt="Form.io">
    <h1>Form<span>.io</span></h1>
    <p>Escanea el código QR del formulario o escribe su código de 6 caracteres.</p>
    <form onsubmit="event.preventDefault(); const c = this.c.value.trim().toUpperCase(); if (c) location.href = '/f/' + encodeURIComponent(c);">
      <input name="c" maxlength="6" placeholder="CÓDIGO" autocomplete="off" aria-label="Código del formulario">
      <button type="submit">Abrir</button>
    </form>
  </div>
</body>
</html>
