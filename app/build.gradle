plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.services)   // lee app/google-services.json (Firebase)
}

android {
    namespace 'com.devcore.formio'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.devcore.formio"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material      // Toolbar, NavigationView, tarjetas, botones, switches
    implementation libs.activity
    implementation libs.fragment      // Fragments: cada vista de la app
    implementation libs.recyclerview  // Listas
    implementation libs.cardview      // Tarjetas
    implementation libs.zxing.core    // Generar los códigos QR

    // Firebase: inicio de sesión y base de datos en la nube (Cloud Firestore)
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.auth
    implementation libs.firebase.firestore

    // SweetAlert: alertas animadas (éxito, error, advertencia y cargando)
    implementation libs.sweetalert
}
